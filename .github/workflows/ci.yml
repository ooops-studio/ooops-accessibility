name: CI

on:
  pull_request:
  push:
    branches:
      - '**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22.14.0
          - 22.x

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout local editor contracts
        run: |
          git init ../ooops-editor
          git -C ../ooops-editor remote add origin https://github.com/ooops-studio/ooops-editor.git
          git -C ../ooops-editor fetch --depth 1 origin 0df7db62da546e57a34f4a3dffc02e06feb4852e
          git -C ../ooops-editor checkout --detach FETCH_HEAD

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.13.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install and build editor contracts
        run: |
          pnpm --dir ../ooops-editor install --frozen-lockfile --filter @ooopsstudio/editor-contracts
          pnpm --dir ../ooops-editor --filter @ooopsstudio/editor-contracts build

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Audit production dependencies
        run: pnpm -w audit:prod

      - name: Audit development dependencies
        run: pnpm -w audit:dev

      - name: Validate workspace
        run: pnpm -w validate:ci
